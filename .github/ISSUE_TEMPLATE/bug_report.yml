name: Bug 报告 / Bug Report
description: 反馈程序崩溃、任务识别异常或运行错误
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先查阅 [在线文档](https://godraymond233.github.io/ok-bd2/) 确认基础设置。
        遇到运行异常时，强烈建议先在程序首页点击 **生成问题报告**，将生成的 `RPT-*` 报告编号与脱敏 ZIP 一并附上，能极大加快排查速度。

  - type: input
    id: version
    attributes:
      label: ok-bd2 版本 / Version
      description: 可在程序窗口标题、设置页或安装包文件名中查看（例如 v2.1.3）
      placeholder: "v2.1.3"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: 安装方式 / Installation Method
      options:
        - China 完整安装包
        - Global 完整安装包
        - Online 在线安装包
        - 从源码运行（main.py / main_debug.py / main_desktop.py）
    validations:
      required: true

  - type: dropdown
    id: resolution
    attributes:
      label: 游戏分辨率 / Game Resolution
      description: 程序要求 16:9 画面比例与 FHD 画质档位
      options:
        - 1920x1080 (推荐)
        - 2560x1440
        - 3840x2160
        - 1600x900
        - 1366x768
        - 1280x720
        - 其他分辨率
    validations:
      required: true

  - type: input
    id: task_name
    attributes:
      label: 出错的任务或页面 / Task or Page
      placeholder: "例如：自动登录 / 快速狩猎 / 每日跑商 / 每周跑图 / 自动 PVP"
    validations:
      required: true

  - type: input
    id: report_id
    attributes:
      label: 问题报告编号（如有）/ Report ID (Optional)
      description: 通过程序内“生成问题报告”生成的编号（格式如 RPT-2026xxxx-xxxxxx），可将对应的脱敏 ZIP 直接拖入下方描述框上传
      placeholder: "RPT-..."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Reproduction Steps
      description: 请尽量写明：触发前游戏停在哪个界面、程序执行了什么动作、实际结果与预期结果有什么差异。可直接拖入截图或脱敏问题报告 ZIP。
      placeholder: |
        1. 启动游戏并进入...
        2. 运行任务...
        3. 在 ... 界面卡住 / 报错...
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: 运行前检查确认 / Pre-flight Checklist
      options:
        - label: 游戏已设置为 16:9 分辨率与 FHD 画质，且未开启显卡滤镜、锐化或悬浮窗叠加层
          required: true
        - label: 运行期间游戏窗口未最小化、未拖出屏幕外，且系统未锁屏/息屏
          required: true
        - label: 我已确认上传的截图或附件中不包含个人敏感账号信息
          required: false
