[project]
name = "ok-bd2"
version = "0.1.1"
description = "An image-recognition-based automation tool for BrownDust II on Windows PC"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "GodRaymond233" },
]
keywords = [
    "browndust2",
    "game-automation",
    "computer-vision",
    "ocr",
    "ok-script",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.8.0",
    "comtypes>=1.4.16",
    "msvc-runtime>=14.44.35112",
    "ok-script[ocr]==3.0.14",
    "numpy>=2.4.0",
    "onnxocr-ppocrv6==0.0.1",
    "opencc>=1.2.0",
    "opencv-python>=4.13.0.92",
    "openvino==2026.4.1",
    "pillow>=12.0.0",
    "psutil>=7.2.2",
    "pydirectinput>=1.0.4",
    "pynput>=1.8.1",
    "pyappify==1.0.20",
    # Desktop client core service (loopback API for the Electron shell).
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "wsproto==1.3.2",
    # 312 打包回归不再捆绑 mfc140u.dll（上游 mhammond/pywin32#2776），
    # 干净系统 import win32ui 必崩；钉 311 直到含修复的新版本发布。
    "pywin32==311; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://godraymond233.github.io/ok-bd2/"
Documentation = "https://godraymond233.github.io/ok-bd2/"
Repository = "https://github.com/GodRaymond233/ok-bd2"
Issues = "https://github.com/GodRaymond233/ok-bd2/issues"
Releases = "https://github.com/GodRaymond233/ok-bd2/releases"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# A copy of ok-script's code, kept comparable with the original.
extend-exclude = ["src/desktop/okweb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Deferred high-churn legacy rules to avoid large diffs across in-flight branches/PRs:
# B023 (loop closure binding), B905 (zip strict), UP017 (datetime.UTC),
# UP035 (typing collections.abc), UP042 (StrEnum migration).
ignore = ["B023", "B905", "UP017", "UP035", "UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
]
