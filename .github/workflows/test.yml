name: test

on:
  push:
    branches-ignore:
      - "dependabot/**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python quality gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate commit attribution
        run: python scripts/check_commit_attribution.py
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
      - name: Validate dependency lock and exports
        shell: pwsh
        run: .\scripts\check_dependency_exports.ps1
      - run: python scripts/install_dependencies.py requirements-dev.txt
      - name: Run final quality checks
        shell: pwsh
        run: .\scripts\run_checks.ps1 -Mode Final

  desktop:
    name: Desktop UI and Electron shell
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            desktop/ui/package-lock.json
            desktop/shell/package-lock.json
      - name: Check, test, and build desktop UI
        shell: pwsh
        run: |
          npm --prefix desktop/ui ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "UI dependency installation failed." }
          npm --prefix desktop/ui run check
          if ($LASTEXITCODE -ne 0) { throw "UI typecheck failed." }
          npm --prefix desktop/ui test
          if ($LASTEXITCODE -ne 0) { throw "UI tests failed." }
          npm --prefix desktop/ui run build
          if ($LASTEXITCODE -ne 0) { throw "UI build failed." }
      - name: Check and test desktop shell
        shell: pwsh
        run: |
          npm --prefix desktop/shell ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Shell dependency installation failed." }
          npm --prefix desktop/shell run check
          if ($LASTEXITCODE -ne 0) { throw "Shell typecheck failed." }
          npm --prefix desktop/shell test
          if ($LASTEXITCODE -ne 0) { throw "Shell tests failed." }
