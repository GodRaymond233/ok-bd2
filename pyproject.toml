[project]
name = "ok-bd2"
version = "0.1.1"
description = "An image-recognition-based automation tool for BD2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.8.0",
    "comtypes>=1.4.16",
    "msvc-runtime>=14.44.35112",
    "ok-script[ocr]==3.0.4",
    "numpy>=2.4.0",
    "onnxocr-ppocrv5==0.0.23",
    "opencc>=1.2.0",
    "opencv-python>=4.13.0.92",
    "openvino==2026.4.1",
    "pillow>=12.0.0",
    "psutil>=7.2.2",
    "pydirectinput>=1.0.4",
    "pynput>=1.8.1",
    "pyappify==1.0.13",
    # Desktop client core service (loopback API for the Electron shell).
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "wsproto==1.3.2",
    # 312 打包回归不再捆绑 mfc140u.dll（上游 mhammond/pywin32#2776），
    # 干净系统 import win32ui 必崩；钉 311 直到含修复的新版本发布。
    "pywin32==311; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
# A copy of ok-script's code, kept comparable with the original.
extend-exclude = ["src/desktop/okweb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
]
