[project]
name = "ok-bd2"
version = "0.1.1"
description = "An image-recognition-based automation tool for BD2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.8.0",
    "comtypes>=1.4.16",
    "msvc-runtime>=14.44.35112",
    "ok-script==1.0.190",
    "numpy>=2.4.0",
    "onnxocr-ppocrv5==0.0.22",
    "opencc>=1.2.0",
    "opencv-python>=4.13.0.92",
    "openvino>=2026.1.0",
    "pillow>=12.0.0",
    "psutil>=7.2.2",
    "pydirectinput>=1.0.4",
    "pynput>=1.8.1",
    "pyappify==1.0.6",
    "pyside6==6.9.1",
    "pyside6-fluent-widgets",
    # 312 打包回归不再捆绑 mfc140u.dll（上游 mhammond/pywin32#2776），
    # 干净系统 import win32ui 必崩；钉 311 直到含修复的新版本发布。
    "pywin32==311; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
]
